<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm - Sneaker Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="index.html">SNEAKER<span>ZONE</span></a></div>
        <nav class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="products.html" class="active">Sản Phẩm</a>
            <a href="collections.html">Bộ Sưu Tập</a>
            <a href="contact.html">Liên Hệ</a>
            <a href="LabTH.html">LabTH</a>
        </nav>
        <div class="nav-icons">
            <div class="search-box">
                <input type="text" placeholder="Tìm giày...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <a href="cart.html" class="cart-icon">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="badge">0</span>
            </a>
        </div>
    </header>

    <div class="page-header">
        <h2>TẤT CẢ SẢN PHẨM</h2>
        <p><a href="index.html">Trang chủ</a> / Sản phẩm</p>
    </div>

    <div class="shop-layout">
        <aside class="sidebar-filter">
            <div class="filter-group">
                <h4>Thương Hiệu</h4>
                <label><input type="checkbox" checked> Tất cả</label>
                <label><input type="checkbox"> Nike</label>
                <label><input type="checkbox"> Adidas</label>
                <label><input type="checkbox"> Puma</label>
                <label><input type="checkbox"> New Balance</label>
            </div>
            <div class="filter-group">
                <h4>Khoảng Giá</h4>
                <label><input type="radio" name="price"> Dưới 1.000.000đ</label>
                <label><input type="radio" name="price"> 1.000.000đ - 2.500.000đ</label>
                <label><input type="radio" name="price" checked> Trên 2.500.000đ</label>
            </div>
            <div class="filter-group">
                <h4>Kích Cỡ (Size)</h4>
                <label><input type="checkbox"> 39</label>
                <label><input type="checkbox"> 40</label>
                <label><input type="checkbox"> 41</label>
                <label><input type="checkbox"> 42</label>
            </div>
        </aside>

        <main class="shop-content">
            <div class="product-grid">
                <div class="product-card">
                    <div class="badge-discount">-20%</div>
                    <div class="product-img">
                        <img src="https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?q=80&w=500&auto=format&fit=crop" alt="Giày">
                    </div>
                    <div class="product-info">
                        <span class="category">Nike</span>
                        <h3 class="title">Air Max Sport Neon</h3>
                        <div class="rating"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i><span>(4.5)</span></div>
                        <div class="price-box">
                            <span class="old-price">2.500.000đ</span>
                            <span class="current-price">1.990.000đ</span>
                        </div>
                        <button class="add-to-cart-btn"><i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="badge-new">NEW</div>
                    <div class="product-img">
                        <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=500&auto=format&fit=crop" alt="Giày">
                    </div>
                    <div class="product-info">
                        <span class="category">Adidas</span>
                        <h3 class="title">Retro Pastel Streetwear</h3>
                        <div class="rating"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><span>(5.0)</span></div>
                        <div class="price-box">
                            <span class="current-price">3.200.000đ</span>
                        </div>
                        <button class="add-to-cart-btn"><i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
